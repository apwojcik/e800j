section bios {
#    set_bios = spectrum48; # nazwa aktualnie wybranego BIOS-a
    set_bios = elwro_1; 
#    set_bios = elwro_2; 
#    set_bios = elwro_3; 
    rompath = "./rom/"; 	   # ¶cie¿ka do katalogu, gdzie znajduj± sie biosy

    section spectrum48 {
	address = 0x0000;
	file    = "zx_spec.bin";
    }

    section elwro_1 {
	address = 0x0000;
	file    = "bas01.bin";
	address = 0x2000;
	file    = "bas11.bin";
	address = 0x4000;
	file    = "boot01.bin";
    }

    section elwro_2 {
	address = 0x0000;
	file    = "bas02.bin";
	address = 0x2000;
	file    = "bas12.bin";
	address = 0x4000;
	file    = "boot02.bin";
    }

    section elwro_3 {
	address = 0x0000;
	file    = "bas03.bin";
	address = 0x2000;
	file    = "bas13.bin";
	address = 0x4000;
	file    = "boot03.bin";
    }

}

section Z80 {
#    call_fq = 20;	# czas w ms, co ile wywo³ywana jest pêtla procesora
#    atom    = 70000;	# ilo¶æ taktów CPU na jedno wywo³anie pêtli
#    intfq   = 70000;    # co ile taktów ma byæ zg³oszone przerwanie maskowalne

    call_fq = 8;	# czas w ms, co ile wywo³ywana jest pêtla procesora
    atom    = 28000;	# ilo¶æ taktów CPU na jedno wywo³anie pêtli
    intfq   = 70000;    # co ile taktów ma byæ zg³oszone przerwanie maskowalne


#    call_fq = 10;	# czas w ms, co ile wywo³ywana jest pêtla procesora
#    atom    = 700000;	# ilo¶æ taktów CPU na jedno wywo³anie pêtli
#    intfq   = 70000;    # co ile taktów ma byæ zg³oszone przerwanie maskowalne

}

section zx_screen{
    section palette {
	bright	   = 0x00;  # ogólna jasno¶æ 
	brt_normal = 0x50;  # poziom jasno¶ci kolorów 
	brt_brt    = 0xf0;  # poziom jasno¶ci kolorów dla trybu rozjasnionego
	brt_wht    = 0xe0;  # poziom jasno¶ci kolorów dla koloru bia³ego 15
    }
    blink = 400;    # czas w ms, co ile ma byæ zmieniony atrybut migotania
    rfsh  = 40;	    # czas w ms, co ile ma byæ od¶wiezony ekran 
    brdsize = 0.1; # szeroko¶æ ramki w stosunku do d³ugo¶ci boków okna
}

section sdl_video {
    fscrn  = 0;    # tryb pe³noekranowy 1/0
#    width  = 280;  # szeroko¶æ okna SDL
#    height = 210;  # wysoko¶æ  okna SDL
    width  = 640;  # szeroko¶æ okna SDL
    height = 480;  # wysoko¶æ  okna SDL

    bpp    = 0;   # g³êbia kolorów
}

section memo {
    rom_bank_size = 0x6000;
    ram_bank_size = 0x10000;
}

section beeper {
    nosound  = 1;	# w³acza/wy³±cza obs³ugê d¼wiêku
    channels = 1;	# ilo¶æ kana³ów; na razie tylko 1 obs³ugiwany
    rbuffer  = 32768;	# rozmiar bufora ko³owego
    samplert = 10000;	# ilo¶æ próbek / sekunde
    dbuffer  = 128;	# d³ugo¶æ bufora liniowego do karty 
    mixvol   = 128;	# g³o¶no¶æ 
    scale    = 60000;   # max ilo¶æ taktów na próbkê
    alias    = 1;	# jesli w³±czony prostok±tny sampl bêdzie generowany jako sinus
}

section joy {
    jmode = "kempston,sinclair"; # dostêpne opcje to kempston,sinclair,agf, none
#sinclair & agf joy 0
    j_0_l = 276; # c-left  
    j_0_r = 275; # c-right 
    j_0_u = 273; # c-up      
    j_0_d = 274; # c-down    
    j_0_f = 32;  # space   
#sinclayr joy 1
    j_1_l = 97;  # a
    j_1_r = 115; # s
    j_1_u = 119; # w
    j_1_d = 122; # z
    j_1_f = 308; # L-ALT  
#kempston joy 0
    j_k_l = 276; 
    j_k_r = 275; 
    j_k_u = 273;  
    j_k_d = 274; 
    j_k_f = 32;  
}

section profile_01 {
    rombios  = bios;       # sekcja biosów
    memory   = memo;	   # sekcja pamiêci
    cpu      = Z80;	   # sekcja emulacji CPU
    screen   = zx_screen;  # sekcja ekranu zx spectrum
    video    = sdl_video;  # sekcja parametrów obrazu SDL
    sound    = beeper;	   # sekcja parametrów d¼wiêku
    joystick = joy;	   # sekcja dla definicji joysticka 
}

# sekcja g³ówna
section main {
    profile = profile_01; # nazwa  profilu
}

