##############################################
# Plik konfiguracyjny emulatora komputera  Elwro 800 Junior
#
#

section bios {
#    set_bios = spectrum48; # nazwa aktualnie wybranego BIOS-a
    set_bios = elwro_1;
#    set_bios = elwro_2;
#    set_bios = elwro_3;
    rompath = "./rom/"; 	   # ścieżka do katalogu, gdzie znajdują się biosy

    section spectrum48 {
        address = 0x0000;
        file    = "zx_spec.bin";
    }

    section elwro_1 {
        address = 0x0000;
        file    = "bas01.bin";
        address = 0x2000;
        file    = "bas11.bin";
        address = 0x4000;
        file    = "boot01.bin";
    }

    section elwro_2 {
        address = 0x0000;
        file    = "bas02.bin";
        address = 0x2000;
        file    = "bas12.bin";
        address = 0x4000;
        file    = "boot02.bin";
    }

    section elwro_3 {
        address = 0x0000;
        file    = "bas03.bin";
        address = 0x2000;
        file    = "bas13.bin";
        address = 0x4000;
        file    = "boot03.bin";
    }

}

section Z80 {
#    call_fq = 20;	# czas w ms, co ile wywoływana jest pętla procesora
#    atom    = 70000;	# ilość taktów CPU na jedno wywołanie pętli
#    intfq   = 70000;    # co ile taktów ma być zgłoszone przerwanie maskowalne

    call_fq = 8;	# czas w ms, co ile wywoływana jest pętla procesora
    atom    = 28000;	# ilość taktów CPU na jedno wywołanie pętli
    intfq   = 70000;    # co ile taktów ma być zgłoszone przerwanie maskowalne


#    call_fq = 10;	# czas w ms, co ile wywoływana jest pętla procesora
#    atom    = 700000;	# ilość taktów CPU na jedno wywołanie pętli
#    intfq   = 70000;    # co ile taktów ma być zgłoszone przerwanie maskowalne

}

section zx_screen{
    section palette {
        bright	   = 0x00;  # ogólna jasność
        brt_normal = 0x50;  # poziom jasności kolorów
        brt_brt    = 0xf0;  # poziom jasności kolorów dla trybu rozjaśnionego
        brt_wht    = 0xe0;  # poziom jasności kolorów dla koloru białego 15
    }
    blink = 400;    # czas w ms, co ile ma być zmieniony atrybut migotania
    rfsh  = 40;	    # czas w ms, co ile ma być odświeżony ekran 
    brdsize = 0.1; # szerokość ramki w stosunku do długości boków okna
}

section sdl_video {
    fscrn  = 0;    # tryb pełnoekranowy 1/0
#    width  = 280;  # szerokość okna SDL
#    height = 210;  # wysokość  okna SDL
    width  = 640;  # szerokość okna SDL
    height = 480;  # wysokość  okna SDL

    bpp    = 0;   # głębia kolorów
}

section memo {
    rom_bank_size = 0x6000;
    ram_bank_size = 0x10000;
}

section beeper {
    nosound  = 1;	# włącza/wyłącza obsługę dźwięku
    channels = 1;	# ilość kanałów; na razie tylko 1 obsługiwany
    rbuffer  = 32768;	# rozmiar bufora kołowego
    samplert = 10000;	# ilość próbek / sekundę
    dbuffer  = 128;	# długość bufora liniowego do karty
    mixvol   = 128;	# głośność
    scale    = 60000;   # max ilość taktów na próbkę
    alias    = 1;	# jeśli włączony prostokątny sampl będzie generowany jako sinus
}

section joy {
    jmode = "kempston,sinclair"; # dostępne opcje to kempston,sinclair,agf, none
#sinclair & agf joy 0
    j_0_l = 276; # c-left
    j_0_r = 275; # c-right
    j_0_u = 273; # c-up
    j_0_d = 274; # c-down
    j_0_f = 32;  # space
#sinclayr joy 1
    j_1_l = 97;  # a
    j_1_r = 115; # s
    j_1_u = 119; # w
    j_1_d = 122; # z
    j_1_f = 308; # L-ALT
#kempston joy 0
    j_k_l = 276;
    j_k_r = 275;
    j_k_u = 273;
    j_k_d = 274;
    j_k_f = 32;
}

section profile_01 {
    rombios  = bios;       # sekcja biosów
    memory   = memo;	   # sekcja pamięci
    cpu      = Z80;	   # sekcja emulacji CPU
    screen   = zx_screen;  # sekcja ekranu zx spectrum
    video    = sdl_video;  # sekcja parametrów obrazu SDL
    sound    = beeper;	   # sekcja parametrów dźwięku
    joystick = joy;	   # sekcja dla definicji joysticka
}

# sekcja główna
section main {
    profile = profile_01; # nazwa  profilu
}

